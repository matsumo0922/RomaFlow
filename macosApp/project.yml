name: RomaFlowMacOS

options:
  minimumXcodeGenVersion: 2.45.4
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.5"
  createIntermediateGroups: true

settings:
  base:
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"

targetTemplates:
  KmpLinkedMacTarget:
    platform: macOS
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        # :core:ime は macosArm64 のみ対応のため、CLI ビルドで x86_64 が要求されないように固定する
        ARCHS: arm64
        # kotlinx-io (WanaKana の推移的依存) が Kotlin/Native の posix-cache を引き込み、その中に
        # Linux 専用の scandirat / fdscandir / fdclosedir ラッパーが含まれる。これらは macOS の libc に
        # 存在せずリンクに失敗するが、romaji→kana 変換はファイルシステムを触らないため実行時には呼ばれない。
        # 該当シンボルのみ未定義を許可してリンクを通す。
        OTHER_LDFLAGS:
          - -Xlinker
          - -U
          - -Xlinker
          - _scandirat
          - -Xlinker
          - -U
          - -Xlinker
          - _fdscandir
          - -Xlinker
          - -U
          - -Xlinker
          - _fdclosedir
    preBuildScripts:
      - name: Embed Swift Export
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          # XcodeGen places SRCROOT at macosApp, so move to the repository root before running Gradle.
          cd "$SRCROOT/.."
          xcrun swiftc --version
          ./gradlew --no-daemon --rerun-tasks :core:ime:embedSwiftExportForXcode

targets:
  RomaFlowHarness:
    templates:
      - KmpLinkedMacTarget
    type: application
    sources:
      - Sources/Harness
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.matsumo.romaflow.macos.harness
    info:
      path: Generated/RomaFlowHarness/Info.plist
      properties:
        CFBundleDisplayName: RomaFlow Harness
        CFBundleShortVersionString: "0.0.1"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"

  RomaFlowInputMethod:
    templates:
      - KmpLinkedMacTarget
    type: application
    sources:
      - Sources/InputMethod
      - path: Resources/InputMethod
        buildPhase: resources
    dependencies:
      - sdk: InputMethodKit.framework
      - sdk: Carbon.framework
    preBuildScripts:
      # U2b: 同梱 Mozc compact binary を生成し、IME bundle の Resources へ複製する。
      # KmpLinkedMacTarget の "Embed Swift Export" より後に走り、生成済み binary を bundle に載せる。
      # binary は build 配下＝git 管理外なので、XcodeGen 時点では存在せずビルド時に生成・複製する。
      - name: Embed Mozc Dictionary
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          cd "$SRCROOT/.."
          ./gradlew --no-daemon :core:ime:generateMozcDictionary
          MOZC_BIN_DIR="$SRCROOT/../core/ime/build/generated/mozc/bin"
          RESOURCES_DIR="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          mkdir -p "$RESOURCES_DIR"
          cp -f "$MOZC_BIN_DIR/mozc_dict.bin" "$RESOURCES_DIR/mozc_dict.bin"
          cp -f "$MOZC_BIN_DIR/mozc_matrix.bin" "$RESOURCES_DIR/mozc_matrix.bin"
    settings:
      base:
        # macOS は bundle ID にドット区切りの "inputmethod" セグメントが含まれるものだけを IME として認識する
        PRODUCT_BUNDLE_IDENTIFIER: me.matsumo.inputmethod.RomaFlow
        PRODUCT_NAME: RomaFlow
    info:
      path: Generated/RomaFlowInputMethod/Info.plist
      properties:
        CFBundleDisplayName: RomaFlow
        CFBundleShortVersionString: "0.0.1"
        CFBundleVersion: "1"
        LSBackgroundOnly: true
        LSMinimumSystemVersion: "14.0"
        InputMethodConnectionName: $(PRODUCT_BUNDLE_IDENTIFIER)_Connection
        InputMethodServerControllerClass: RomaFlowInputController
        TISInputSourceID: me.matsumo.inputmethod.RomaFlow
        TISIntendedLanguage: ja
        tsInputMethodCharacterRepertoireKey:
          - Latn
          - Hira
          - Kana
        tsInputMethodIconFileKey: main.tiff
        # Apple の canonical mode ID を使うと、システム設定の「日本語」カテゴリに表示される (azooKey 方式)。
        # 英語入力は別 input source (ABC) に任せるため、英数 (Roman) モードは提供しない。
        ComponentInputModeDict:
          tsVisibleInputModeOrderedArrayKey:
            - com.apple.inputmethod.Japanese
          tsInputModeListKey:
            com.apple.inputmethod.Japanese:
              TISInputSourceID: me.matsumo.inputmethod.RomaFlow.Japanese
              TISIntendedLanguage: ja
              TISIconIsTemplate: true
              tsInputModePrimaryInScriptKey: true
              tsInputModeScriptKey: smJapanese
              tsInputModeDefaultStateKey: true
              tsInputModeIsVisibleKey: true
              tsInputModeMenuIconFileKey: main.tiff
              tsInputModeAlternateMenuIconFileKey: main.tiff
              tsInputModePaletteIconFileKey: main.tiff
