# Mozc OSS 辞書（google/mozc, src/data/dictionary_oss）のソース pin。
# ビルド時生成（hermetic）の source of truth: 固定 commit から各ファイルを取得し、
# SHA-256 で検証してから compact binary を生成する。値の変更＝upstream 差し替えを意味する。
