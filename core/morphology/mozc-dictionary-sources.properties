# 辞書: dictionary00〜09.txt（TSV「読み\t左ID\t右ID\tコスト\t表層[\tSPELLING_CORRECTION]」、読み hiragana）
# 連接: connection_single_column.txt（1 行目=次元、以降 row-major のコスト）
# ライセンス表記: README.txt（NAIST/IPAdic + 沖縄辞書 + Mozc BSD-3 の attribution）

